<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Norse Audio – Contact</title>
  <meta name="description" content="Contact Norse Audio through the form on this page.">
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=1">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../index.html" aria-label="Norse Audio home">
        <img src="../images/brand/logo.png?v=1" width="200" height="53" alt="Norse">
      </a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
      <nav class="site-nav" id="site-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../products/">Products</a></li>
          <li><a href="../about-us/">About Us</a></li>
          <li><a href="../news/">News</a></li>
          <li><a href="../contact/" aria-current="page">Contact</a></li>
          <li><a href="../family/">Family</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="wrap">
      <div class="split reverse">
        <div>
          <img src="../images/products/front.jpg" alt="Norse Audio component">
        </div>
        <div>
          <h1>Contact form</h1>
          <p class="lede">You can contact us by filling out this form.</p>

          <form class="form" data-contact action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
            <input type="hidden" name="from_name" value="Norse Audio website">
            <input type="hidden" name="subject" value="Contact form — norseaudio.se">
            <div class="hp" aria-hidden="true">
              <label>Leave this empty <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></label>
            </div>

            <div>
              <label for="name">Name <span class="req">*</span></label>
              <input id="name" name="name" type="text" required autocomplete="name">
            </div>
            <div>
              <label for="email">E-mail <span class="req">*</span></label>
              <input id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div>
              <label for="message">Message <span class="req">*</span></label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button class="btn" type="submit">Submit</button>
            <div class="form-status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="inner">
      <div>Norse Audio, powered by Bladelius</div>
      <div class="footer-social">
        <a href="https://www.facebook.com/profile.php?id=61580190315646" target="_blank" rel="noopener" title="Facebook" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v2H6v4h3v8h4v-8h3l1-4h-4V9c0-.6.4-1 1-1z"/></svg></a>
        <a href="https://www.instagram.com/norse_audio/" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.6A2.2 2.2 0 1 0 14.2 12 2.2 2.2 0 0 0 12 9.8zM17.2 6.6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/></svg></a>
      </div>
    </div>
  </footer>
  <script src="../js/main.js?v=1"></script>
</body>
</html>
